name: Markov Telegram alerts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test message"
        type: boolean
        default: false

concurrency:
  group: mre-bot-${{ inputs.test && 'test' || 'live' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: mre-state-${{ github.run_id }}
          restore-keys: mre-state-
      - run: python mre_bot.py ${{ inputs.test && '--test' || '--minutes 350' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: mre-state-${{ github.run_id }}
